<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración - YouTube Gemini Summarizer</title>
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: rgba(22, 30, 46, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --gradient-brand: linear-gradient(135deg, #FF0000 0%, #A855F7 100%);
      --gradient-btn: linear-gradient(135deg, #9333EA 0%, #6366F1 100%);
      --radius-md: 8px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .options-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-box {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }

    .header-info h1 {
      font-size: 20px;
      font-weight: 700;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-info p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 40px 10px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #A855F7;
    }

    .toggle-visibility {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
    }

    .help-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .help-text a {
      color: #A855F7;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--gradient-btn);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .toast {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
    }

    .toast.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ADE80;
    }

    .toast.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
    }
  </style>
</head>
<body>

  <div class="options-container">
    <header class="header-card">
      <div class="logo-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M21.582 6.186a2.696 2.696 0 0 0-1.897-1.897C17.99 3.8 12 3.8 12 3.8s-5.99 0-7.685.489C2.62 4.689 1.93 5.38 1.44 6.186 1 7.88 1 12 1 12s0 4.12.44 5.814c.49.806 1.18 1.497 1.875 1.897C4.99 20.2 12 20.2 12 20.2s5.99 0 7.685-.489c.695-.4 1.385-1.091 1.897-1.897C23 16.12 23 12 23 12s0-4.12-.418-5.814zM9.8 15.5V8.5l6.2 3.5-6.2 3.5z" fill="#A855F7"/>
        </svg>
      </div>
      <div class="header-info">
        <h1>Configuración de YouTube Gemini</h1>
        <p>Configura tu clave de API para activar los resúmenes en tiempo real.</p>
      </div>
    </header>

    <main class="settings-card">
      <div class="form-group">
        <label for="apiKeyInput">Google Gemini API Key:</label>
        <div class="input-wrapper">
          <input type="password" id="apiKeyInput" placeholder="AIzaSy..." autocomplete="off">
          <button id="toggleVisibilityBtn" class="toggle-visibility" type="button" title="Mostrar/Ocultar">👁️</button>
        </div>
        <p class="help-text">
          Obtén tu clave de API gratuita en <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio ↗</a>.
        </p>
      </div>

      <div class="btn-row">
        <button id="saveBtn" class="btn btn-primary">Guardar Configuración</button>
        <button id="testBtn" class="btn btn-secondary">Probar Conexión</button>
      </div>

      <div id="toastMessage" class="toast"></div>
    </main>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
